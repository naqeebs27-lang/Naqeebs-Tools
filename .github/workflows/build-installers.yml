name: Build Windows installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installers:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show Node.js version
        shell: pwsh
        run: node --version

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore dependencies
        run: dotnet restore SmartTools/SmartTools.csproj

      - name: Publish Windows x64 application
        run: >-
          dotnet publish SmartTools/SmartTools.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --property:PublishSingleFile=true
          --property:IncludeNativeLibrariesForSelfExtract=true
          --output publish/win-x64

      - name: Create portable Windows x64 ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive `
            -Path publish/win-x64/* `
            -DestinationPath artifacts/Naqeebs-Smart-Tools-win-x64.zip `
            -CompressionLevel Optimal

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows x64 installer
        shell: pwsh
        run: iscc installer/SmartToolsSuite.iss

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Naqeebs-Smart-Tools-windows-x64
          path: artifacts/*
          if-no-files-found: error
